<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="content">

    <!-- Breadcrumb -->
    <nav class="mb-6 text-sm text-muted">
        <a th:href="@{/query}" class="hover:text-foreground transition-colors">Query Catalog</a>
        <span class="mx-1.5">/</span>
        <span class="text-foreground font-medium font-mono" th:text="${entry.name}">query</span>
    </nav>

    <!-- Header -->
    <div class="mb-6 flex items-start justify-between">
        <div>
            <div class="flex items-center gap-3 mb-1">
                <h1 class="text-xl font-bold text-foreground font-mono" th:text="${entry.name}">query.name</h1>
                <span class="inline-flex items-center rounded-md px-2.5 py-0.5 text-xs font-semibold"
                      th:classappend="${entry.category == 'H3'} ? 'bg-accent/10 text-accent' :
                                      (${entry.category == 'LIVE'} ? 'bg-success/10 text-success' : 'bg-primary/10 text-primary')"
                      th:text="${entry.category}">CAT</span>
                <span th:if="${entry.streaming}"
                      class="inline-flex items-center rounded-full px-2 py-0.5 text-[0.6rem]
                             font-medium bg-success/10 text-success">STREAMING</span>
            </div>
            <p class="text-sm text-muted" th:text="${entry.description ?: 'No description'}">desc</p>
        </div>
        <form th:action="@{/query/{id}/delete(id=${entry.id})}" method="post"
              onsubmit="return confirm('Delete this query?')">
            <button type="submit"
                    class="inline-flex items-center gap-1.5 rounded-lg border border-danger/30 px-3 py-2
                           text-xs font-medium text-danger hover:bg-danger/10 transition-colors">
                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
                </svg>
                Delete
            </button>
        </form>
    </div>

    <!-- SQL -->
    <div class="mb-6 bg-surface border border-border rounded-xl overflow-hidden">
        <div class="px-5 py-3 border-b border-border flex items-center justify-between">
            <h2 class="text-sm font-semibold text-foreground">SQL</h2>
            <span class="text-xs text-muted"
                  th:text="'Timeout: ' + ${entry.timeoutMs} + 'ms'">Timeout: 30000ms</span>
        </div>
        <pre class="p-5 text-sm text-foreground font-mono leading-relaxed overflow-x-auto
                    bg-background/50" th:text="${entry.querySql}">SELECT ...</pre>
    </div>

    <!-- Execute form -->
    <div class="mb-6 bg-surface border border-border rounded-xl p-5">
        <h2 class="text-sm font-semibold text-foreground mb-4">Execute</h2>

        <form th:action="@{/query/{name}/execute(name=${entry.name})}" method="post" class="space-y-4">

            <div th:if="${paramNames != null && !paramNames.isEmpty()}"
                 class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <div th:each="pName : ${paramNames}">
                    <label th:for="${pName}"
                           class="block text-sm font-medium text-foreground mb-1 font-mono"
                           th:text="${pName}">param</label>
                    <input type="text" th:id="${pName}" th:name="${pName}"
                           th:value="${suppliedParams != null ? suppliedParams.get(pName) : ''}"
                           th:placeholder="':' + ${pName}"
                           class="w-full rounded-lg border border-input bg-background px-3 py-2
                                  text-sm text-foreground font-mono placeholder:text-placeholder
                                  focus:outline-none focus:ring-2 focus:ring-ring/40 focus:border-primary hover:border-input-hover transition-colors">
                </div>
            </div>

            <div th:if="${paramNames == null || paramNames.isEmpty()}"
                 class="text-sm text-muted">This query takes no parameters.</div>

            <button type="submit"
                    class="inline-flex items-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm
                           font-medium text-primary-foreground hover:bg-primary-hover transition-all shadow-sm">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"/>
                </svg>
                Run Query
            </button>
        </form>
    </div>

    <!-- Results -->
    <div th:if="${result != null}" class="mb-6">

        <!-- Result header -->
        <div class="mb-3 flex items-center gap-4">
            <span th:if="${result.success()}"
                  class="inline-flex items-center rounded-full px-3 py-1 text-xs font-medium bg-success/10 text-success">
                Success</span>
            <span th:if="${!result.success()}"
                  class="inline-flex items-center rounded-full px-3 py-1 text-xs font-medium bg-danger/10 text-danger">
                Failed</span>
            <span class="text-sm text-muted"
                  th:text="${result.rowCount() + ' rows in ' + result.elapsedMs() + 'ms'}">—</span>
        </div>

        <!-- Error message -->
        <div th:if="${!result.success()}"
             class="mb-4 rounded-lg bg-danger/10 border border-danger/20 px-4 py-3 text-sm text-danger">
            <span th:text="${result.errorMessage()}">Error</span>
        </div>

        <!-- Result table -->
        <div th:if="${result.success() && result.rowCount() > 0}"
             class="bg-surface border border-border rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                    <tr class="border-b border-border text-left">
                        <th th:each="col : ${result.rows().get(0).keySet()}"
                            class="px-4 py-3 font-medium text-muted text-xs font-mono whitespace-nowrap"
                            th:text="${col}">col</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row, stat : ${result.rows()}"
                        th:if="${stat.index < 100}"
                        class="border-b border-border/50 hover:bg-background/50">
                        <td th:each="col : ${row.keySet()}"
                            class="px-4 py-2.5 text-foreground text-xs font-mono whitespace-nowrap max-w-xs truncate"
                            th:title="${row.get(col)}"
                            th:text="${#strings.abbreviate('' + row.get(col), 80)}">val</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${result.rowCount() > 100}"
                 class="px-4 py-3 border-t border-border text-xs text-muted text-center">
                Showing first 100 of <span th:text="${result.rowCount()}">N</span> rows.
                Use the API for full results.
            </div>
        </div>

        <div th:if="${result.success() && result.rowCount() == 0}"
             class="text-center py-6 text-sm text-muted">
            Query returned no results.
        </div>
    </div>

    <!-- Parameter schema reference -->
    <div th:if="${entry.paramSchema != null}" class="mb-6 bg-surface border border-border rounded-xl overflow-hidden">
        <div class="px-5 py-3 border-b border-border">
            <h2 class="text-sm font-semibold text-foreground">Parameter Schema</h2>
        </div>
        <pre class="p-5 text-xs text-muted font-mono leading-relaxed overflow-x-auto
                    bg-background/50" th:text="${paramSchemaJson}">{}</pre>
    </div>

    <!-- Tags -->
    <div th:if="${entry.tags != null && !entry.tags.isEmpty()}" class="flex flex-wrap gap-2">
        <span th:each="tag : ${entry.tags}"
              class="inline-flex items-center rounded-md bg-surface border border-border
                     px-2.5 py-1 text-xs font-medium text-muted"
              th:text="${tag}">tag</span>
    </div>

    <!-- API hint -->
    <div class="mt-6 bg-surface border border-border rounded-xl p-4">
        <p class="text-xs text-muted font-mono">
            <span class="text-accent">POST</span>
            <span th:text="'/tessera/api/queries/' + ${entry.name} + '/execute'">endpoint</span>
        </p>
    </div>

</th:block>

</body>
</html>
